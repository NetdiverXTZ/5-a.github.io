name: Sync Telegram Homework

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: # Позволяет запускать вручную из интерфейса GitHub

permissions:
  contents: write

jobs:
  fetch-homework:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch messages from Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
        run: python scripts/fetch_hw.py

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/homework.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update homework from Telegram"
            git pull --rebase --autostash
            git push
          else
            echo "No changes to commit"
          fi

