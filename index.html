<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png" type="image/png">
    <title>5-А Розклад занять з онлайн-посиланнями</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-bg: #eff6ff;
            --link-color: #1d4ed8;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 900px;
        }
        h1 {
            color: var(--primary-color);
            margin: 0 0 10px 0;
            font-size: 2rem;
        }
        .container {
            margin-bottom: 20px;
            text-align: center;
        }
        #startBtn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #startBtn:hover {
            background-color: #1d4ed8;
        }
        #status {
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .schedule-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .day-block {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            padding: 24px;
            border: 1px solid var(--border-color);
        }
        .day-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0 0 20px 0;
            border-bottom: 2px solid var(--accent-bg);
            padding-bottom: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            table-layout: fixed;
        }
        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            padding: 12px;
            border-bottom: 2px solid var(--border-color);
        }
        td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background-color: var(--bg-color);
        }
        
        /* Розміри колонок */
        .col-num { width: 6%; text-align: center; border-right: 1px solid var(--border-color); }
        .col-time { width: 15%; white-space: nowrap; border-right: 1px solid var(--border-color); }
        .col-subject { width: 37%; }
        .col-teacher { width: 26%; border-left: 1px solid var(--border-color); }
        .col-mode { width: 16%; border-left: 1px solid var(--border-color); text-align: center; }

        .lesson-num {
            font-weight: 700;
            color: var(--primary-color);
            text-align: center;
            border-right: 1px solid var(--border-color);
        }
        .lesson-time {
            color: var(--text-muted);
            font-size: 0.85rem;
            border-right: 1px solid var(--border-color);
        }
        .lesson-link {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 600;
        }
        .lesson-link:hover {
            text-decoration: underline;
        }
        .lesson-no-link {
            font-weight: 600;
            color: var(--text-main);
        }
        .teacher-name {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-style: italic;
            border-left: 1px solid var(--border-color);
        }
        .lesson-mode {
            color: var(--text-muted);
            font-size: 0.85rem;
            border-left: 1px solid var(--border-color);
            text-align: center;
        }

        @media screen and (max-width: 768px) {
            table { table-layout: auto; }
            .col-num, .col-time, .col-subject, .col-teacher, .col-mode { width: auto; }
            thead { display: none; }
            tr { display: flex; flex-direction: column; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
            tr:last-child { border-bottom: none; }
            td { padding: 4px 0; }
            .lesson-num, .lesson-mode { text-align: left; }
            .lesson-num::before { content: "Урок № "; }
        }
    </style>
</head>
<body>

    <header>
        <h1>5-А Розклад занять з онлайн-посиланнями</h1>
    </header>

    <div class="container">
        <button id="startBtn" onclick="startScheduler()">Активувати дзвоник</button>
        <div id="status">Натисни кнопку для активації звука</div>
    </div>

    <div class="schedule-container" id="schedule-container">
        <p style="text-align: center; color: var(--text-muted);">Завантаження розкладу...</p>
    </div>

    <script>
        const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRZdRAF8dkzjJh0lOpeZkSOsfqfBf62pM8VT-XWZJ7iUwkY_69VBD1_GVfexY5OE2Fv4xkRC74v2rlR/pub?output=csv';

        // 1. Отримання даних з Google Sheet CSV
        async function readGoogleSheet() {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Помилка мережі: ${response.status}`);
                
                const text = await response.text();
                const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
                
                return lines.map(line => {
                    const row = [];
                    let cell = '';
                    let inQuotes = false;
                    
                    for (let i = 0; i < line.length; i++) {
                        const char = line[i];
                        const nextChar = line[i + 1];
                        
                        if (char === '"') {
                            if (inQuotes && nextChar === '"') {
                                cell += '"';
                                i++;
                            } else {
                                inQuotes = !inQuotes;
                            }
                        } else if (char === ',' && !inQuotes) {
                            row.push(cell.trim());
                            cell = '';
                        } else {
                            cell += char;
                        }
                    }
                    row.push(cell.trim());
                    return row;
                });
            } catch (error) {
                console.error('Помилка зчитування таблиці:', error);
                return null;
            }
        }

        // 2. Групування даних по днях (з суворим збігом назви дня)
        function groupDataByDay(rows) {
            console.log('Отримані рядки з таблиці:', rows);
            
            const days = {};
            let currentDay = '';

            const dayKeywords = ['понеділок', 'вівторок', 'середа', 'четвер', 'п\'ятниця', 'п’ятниця', 'субота', 'неділя'];

            rows.forEach(row => {
                if (!row || row.length === 0) return;

                // Перевіряємо, чи є комірка, яка СТРОГО містить ЛИШЕ назву дня тижня
                const dayCell = row.find(cell => {
                    // Видаляємо пробіли та розділові знаки по краях для чистого порівняння
                    const cleanCell = cell.trim().toLowerCase().replace(/^[^a-zA-Zа-яА-ЯіІїЇєЄґҐ']+|[^a-zA-Zа-яА-ЯіІїЇєЄґҐ']+$/g, '');
                    return dayKeywords.some(keyword => cleanCell === keyword);
                });

                if (dayCell) {
                    // Зберігаємо ТОЧНИЙ оригінальний текст з комірки
                    currentDay = dayCell.trim();
                    if (!days[currentDay]) {
                        days[currentDay] = [];
                    }
                    return;
                }

                // Перевіряємо, чи є рядок заголовком таблиці (пропускаємо його)
                const firstCell = (row[0] || '').toLowerCase();
                if (firstCell === '№' || firstCell === 'n' || firstCell === 'num' || firstCell.includes('час')) {
                    return;
                }

                // Записуємо дані уроку, якщо поточний день вже визначений і є номер/час/предмет
                if (currentDay && (row[0] || row[1] || row[2])) {
                    days[currentDay].push({
                        num: row[0] || '',
                        time: row[1] || '',
                        subject: row[2] || '',
                        teacher: row[3] || '',
                        link: row[4] || '',
                        mode: row[5] || ''
                    });
                }
            });

            return days;
        }

        // 3. Відображення сформованого HTML
        function renderSchedule(groupedData) {
            const container = document.getElementById('schedule-container');
            let fullHTML = '';

            const dayEntries = Object.entries(groupedData);

            if (dayEntries.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: red;">Дані у таблиці не знайдені або мають нестандартний формат.</p>';
                return;
            }

            for (const [dayName, lessons] of dayEntries) {
                if (lessons.length === 0) continue;

                const rowsHTML = lessons.map(lesson => {
                    const subjectContent = (lesson.link && lesson.link.startsWith('http'))
                        ? `<a href="${lesson.link}" target="_blank" class="lesson-link">${lesson.subject}</a>`
                        : `<span class="lesson-no-link">${lesson.subject}</span>`;

                    return `
                        <tr>
                            <td class="lesson-num">${lesson.num}</td>
                            <td class="lesson-time">${lesson.time}</td>
                            <td>${subjectContent}</td>
                            <td class="teacher-name">${lesson.teacher}</td>
                            <td class="lesson-mode">${lesson.mode}</td>
                        </tr>
                    `;
                }).join('');

                fullHTML += `
                    <div class="day-block">
                        <div class="day-title">${dayName}</div>
                        <table>
                            <thead>
                                <tr>
                                    <th class="col-num">№</th>
                                    <th class="col-time">Час</th>
                                    <th class="col-subject">Предмет</th>
                                    <th class="col-teacher">Вчитель</th>
                                    <th class="col-mode">Режим</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHTML}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            container.innerHTML = fullHTML;
        }

        // 4. Запуск ініціалізації
        async function initSchedule() {
            const rawData = await readGoogleSheet();
            if (rawData && rawData.length > 0) {
                const groupedData = groupDataByDay(rawData);
                renderSchedule(groupedData);
            } else {
                document.getElementById('schedule-container').innerHTML = 
                    '<p style="text-align: center; color: red;">Не вдалося завантажити розклад.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', initSchedule);

        function startScheduler() {
            document.getElementById('status').innerText = 'Звук активовано!';
        }
    </script>
</body>
</html>
