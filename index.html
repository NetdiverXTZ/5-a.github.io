<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png" type="image/png">
    <title>5-А Розклад занять з онлайн-посиланнями</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-bg: #eff6ff;
            --link-color: #1d4ed8;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 950px;
        }
        h1 {
            color: var(--primary-color);
            margin: 0 0 10px 0;
            font-size: 2rem;
        }
        .container {
            margin-bottom: 20px;
            text-align: center;
        }
        #startBtn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #startBtn:hover {
            background-color: #1d4ed8;
        }
        #status {
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .schedule-container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .day-block {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            padding: 24px;
            border: 1px solid var(--border-color);
        }
        .day-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0 0 20px 0;
            border-bottom: 2px solid var(--accent-bg);
            padding-bottom: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            table-layout: fixed;
        }
        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            padding: 12px;
            border-bottom: 2px solid var(--border-color);
        }
        td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background-color: var(--bg-color);
        }
        
        /* Розміри колонок */
        .col-num { width: 5%; text-align: center; border-right: 1px solid var(--border-color); }
        .col-time { width: 13%; white-space: nowrap; border-right: 1px solid var(--border-color); }
        .col-subject { width: 28%; }
        .col-teacher { width: 24%; border-left: 1px solid var(--border-color); }
        .col-hw { width: 18%; border-left: 1px solid var(--border-color); text-align: center; }
        .col-mode { width: 12%; border-left: 1px solid var(--border-color); text-align: center; }

        .lesson-num {
            font-weight: 700;
            color: var(--primary-color);
            text-align: center;
            border-right: 1px solid var(--border-color);
        }
        .lesson-time {
            color: var(--text-muted);
            font-size: 0.85rem;
            border-right: 1px solid var(--border-color);
        }
        .lesson-link {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 600;
        }
        .lesson-link:hover {
            text-decoration: underline;
        }
        .lesson-no-link {
            font-weight: 600;
            color: var(--text-main);
        }
        .teacher-name {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-style: italic;
            border-left: 1px solid var(--border-color);
        }
        .hw-address {
            color: var(--text-main);
            font-size: 0.85rem;
            border-left: 1px solid var(--border-color);
            text-align: center;
            word-break: break-all;
        }
        .lesson-mode {
            color: var(--text-muted);
            font-size: 0.85rem;
            border-left: 1px solid var(--border-color);
            text-align: center;
        }

        /* Подсветка асинхронного режима */
        .mode-async {
            background-color: #fee2e2 !important;
            color: #dc2626 !important;
            font-weight: 600;
            border-radius: 6px;
        }

        @media screen and (max-width: 768px) {
            table { table-layout: auto; }
            .col-num, .col-time, .col-subject, .col-teacher, .col-hw, .col-mode { width: auto; }
            thead { display: none; }
            tr { display: flex; flex-direction: column; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
            tr:last-child { border-bottom: none; }
            td { padding: 4px 0; }
            .lesson-num, .lesson-mode, .hw-address { text-align: left; }
            .lesson-num::before { content: "Урок № "; }
        }
    </style>
</head>
<body>

    <header>
        <h1>5-А Розклад занять з онлайн-посиланнями</h1>
    </header>

    <div class="container">
        <button id="startBtn" onclick="startScheduler()">Активувати дзвоник</button>
        <div id="status">Натисни кнопку для активації звука</div>
    </div>

    <div class="schedule-container" id="schedule-container">
        <p style="text-align: center; color: var(--text-muted);">Завантаження розкладу...</p>
    </div>

    <script>
        const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRZdRAF8dkzjJh0lOpeZkSOsfqfBf62pM8VT-XWZJ7iUwkY_69VBD1_GVfexY5OE2Fv4xkRC74v2rlR/pub?output=csv';

        // Карта поиска по ключевым частям фамилий
        const hwMapBySurname = [
            { key: 'скрепіль', val: '?' },
            { key: 'семеняка', val: 'Telegram' },
            { key: 'синельник', val: '?' },
            { key: 'лобанова', val: '?' },
            { key: 'мухіна', val: '?' },
            { key: 'кротова', val: 'krotova.kristina.v@gmail.com' },
            { key: 'демидова', val: 'andemidova@ukr.net' },
            { key: 'матвєєва', val: 'Telegram' },
            { key: 'іщенко', val: '?' },
            { key: 'сергєєвська', val: '?' },
            { key: 'середа', val: '?' },
            { key: 'олійник', val: '?' },
        ];

        // Функция поиска адреса ДЗ
        function getHwAddress(teacherName) {
            if (!teacherName) return '';
            
            const cleanName = teacherName.replace(/\s+/g, ' ').trim().toLowerCase();
            
            // Если имя учителя отсутствует или указан прочерк
            if (!cleanName || cleanName === '-' || cleanName === '—') return '';

            const found = hwMapBySurname.find(item => cleanName.includes(item.key));
            return found ? found.val : '?';
        }

        // 1. Отримання даних з Google Sheet CSV
        async function readGoogleSheet() {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Помилка мережі: ${response.status}`);
                
                const text = await response.text();
                const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
                
                return lines.map(line => {
                    const row = [];
                    let cell = '';
                    let inQuotes = false;
                    
                    for (let i = 0; i < line.length; i++) {
                        const char = line[i];
                        const nextChar = line[i + 1];
                        
                        if (char === '"') {
                            if (inQuotes && nextChar === '"') {
                                cell += '"';
                                i++;
                            } else {
                                inQuotes = !inQuotes;
                            }
                        } else if (char === ',' && !inQuotes) {
                            row.push(cell.trim());
                            cell = '';
                        } else {
                            cell += char;
                        }
                    }
                    row.push(cell.trim());
                    return row;
                });
            } catch (error) {
                console.error('Помилка зчитування таблиці:', error);
                return null;
            }
        }

        // 2. Групування даних по днях
        function groupDataByDay(rows) {
            const days = {};
            let currentDay = '';

            const dayKeywords = ['понеділок', 'вівторок', 'середа', 'четвер', 'п\'ятниця', 'п’ятниця', 'субота', 'неділя'];

            rows.forEach(row => {
                if (!row || row.length === 0) return;

                const dayCell = row.find(cell => {
                    const cleanCell = cell.trim().toLowerCase().replace(/^[^a-zA-Zа-яА-ЯіІїЇєЄґҐ']+|[^a-zA-Zа-яА-ЯіІїЇєЄґҐ']+$/g, '');
                    return dayKeywords.some(keyword => cleanCell === keyword);
                });

                if (dayCell) {
                    currentDay = dayCell.trim();
                    if (!days[currentDay]) {
                        days[currentDay] = [];
                    }
                    return;
                }

                const firstCell = (row[0] || '').toLowerCase();
                if (firstCell === '№' || firstCell === 'n' || firstCell === 'num' || firstCell.includes('час')) {
                    return;
                }

                if (currentDay && (row[0] || row[1] || row[2])) {
                    days[currentDay].push({
                        num: row[0] || '',
                        time: row[1] || '',
                        subject: row[2] || '',
                        teacher: row[3] || '',
                        link: row[4] || '',
                        mode: row[5] || ''
                    });
                }
            });

            return days;
        }

        // 3. Відображення сформованого HTML
        function renderSchedule(groupedData) {
            const container = document.getElementById('schedule-container');
            let fullHTML = '';

            const dayEntries = Object.entries(groupedData);

            if (dayEntries.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: red;">Дані у таблиці не знайдені або мають нестандартний формат.</p>';
                return;
            }

            for (const [dayName, lessons] of dayEntries) {
                if (lessons.length === 0) continue;

                const rowsHTML = lessons.map(lesson => {
                    // Подмена ссылки для математики
                    const isMath = lesson.subject.toLowerCase().includes('математика');
                    const mathZoomLink = 'https://us02web.zoom.us/j/88644443023?pwd=vZCz1ca2lbLvJjDaknAG5VZZrBbm1p.1';
                    const targetLink = isMath ? mathZoomLink : lesson.link;

                    const subjectContent = (targetLink && targetLink.startsWith('http'))
                        ? `<a href="${targetLink}" target="_blank" class="lesson-link">${lesson.subject}</a>`
                        : `<span class="lesson-no-link">${lesson.subject}</span>`;
                    
                    // Проверка на слово "асинхронний"
                    const isAsync = (lesson.mode || '').toLowerCase().includes('асинхрон');
                    const modeClass = isAsync ? 'lesson-mode mode-async' : 'lesson-mode';

                    // Получаем адрес ДЗ
                    const hwAddress = getHwAddress(lesson.teacher);

                    return `
                        <tr>
                            <td class="lesson-num">${lesson.num}</td>
                            <td class="lesson-time">${lesson.time}</td>
                            <td>${subjectContent}</td>
                            <td class="teacher-name">${lesson.teacher}</td>
                            <td class="hw-address">${hwAddress}</td>
                            <td class="${modeClass}">${lesson.mode}</td>
                        </tr>
                    `;
                }).join('');

                fullHTML += `
                    <div class="day-block">
                        <div class="day-title">${dayName}</div>
                        <table>
                            <thead>
                                <tr>
                                    <th class="col-num">№</th>
                                    <th class="col-time">Час</th>
                                    <th class="col-subject">Предмет</th>
                                    <th class="col-teacher">Вчитель</th>
                                    <th class="col-hw">Адреса ДЗ</th>
                                    <th class="col-mode">Режим</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHTML}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            container.innerHTML = fullHTML;
        }

        // 4. Запуск ініціалізації
        async function initSchedule() {
            const rawData = await readGoogleSheet();
            if (rawData && rawData.length > 0) {
                const groupedData = groupDataByDay(rawData);
                renderSchedule(groupedData);
            } else {
                document.getElementById('schedule-container').innerHTML = 
                    '<p style="text-align: center; color: red;">Не вдалося завантажити розклад.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', initSchedule);

        //=============================================================================
        const SOUND_URL = "1.mp3";

        const alarmTimes = [
            { hour: 8, minute: 29 },
            { hour: 9, minute: 24 },
            { hour: 10, minute: 14 },
            { hour: 11, minute: 04 },
            { hour: 12, minute: 04 },
            { hour: 12, minute: 54 },
			{ hour: 13, minute: 44 }
        ];

        function startScheduler() {
            const btn = document.getElementById('startBtn');
            const statusDiv = document.getElementById('status');
            
            btn.disabled = true;
            btn.style.backgroundColor = '#16a34a';
            btn.innerText = "Дзвоник активовано ⏰";
            statusDiv.innerHTML = "Чекаємо на наступний урок...";

            const initAudio = new Audio(SOUND_URL);
            initAudio.volume = 0;
            initAudio.play().catch(() => {});

            setInterval(() => {
                checkTime(statusDiv);
            }, 60000);

            checkTime(statusDiv);
        }

        function checkTime(statusElement) {
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();

            const hasAlarm = alarmTimes.some(time => time.hour === currentHour && time.minute === currentMinute);

            if (hasAlarm) {
                playSound(statusElement);
            }
        }

        function playSound(statusElement) {
            const audio = new Audio(SOUND_URL);
            audio.play()
                .then(() => {
                    statusElement.innerHTML = "<span style='color: green;'>🔔 Пора на урок!</span>";
                    setTimeout(() => {
                        statusElement.innerHTML = "Чекаємо на наступний урок...";
                    }, 10000);
                })
                .catch(error => {
                    statusElement.innerHTML = "<span style='color: red;'>Помилка звука. Перезавантажте сторінку!</span>";
                    console.error(error);
                });
        }        
    </script>
</body>
</html>
